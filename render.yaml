services:
  - type: web
    name: sinaliscord
    runtime: node
    plan: free
    region: virginia
    repo: https://github.com/slamartins92-hash/teste-mestre
    buildCommand: npm install --prefix sinaliscord
    startCommand: node sinaliscord/server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sinaliscord-db
          property: connectionString
      - key: SINALIS_MIGRATION_CREDENTIALS
        sync: false
      - key: SINALIS_MIGRATION_MIN_MESSAGES
        value: "33"
databases:
  - name: sinaliscord-db
    plan: free
    region: virginia
